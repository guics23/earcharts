<title>Fly Me to the Moon – Bart Howard</title>
<style>
@page { size: A4; margin: 14mm; }
* { box-sizing: border-box; }
:root { --bg: #fff; --ink: #222; --muted: #444; --chord-ink: #8a8a8a; color-scheme: light; }
@media screen and (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #141414; --ink: #e6e6e6; --muted: #b3b3b3; --chord-ink: #8c8c8c; color-scheme: dark; }
}
@media screen {
  :root[data-theme="dark"] { --bg: #141414; --ink: #e6e6e6; --muted: #b3b3b3; --chord-ink: #8c8c8c; color-scheme: dark; }
}
html { background: var(--bg); color: var(--ink); }
body { margin: 0; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
main { max-width: 900px; margin: 0 auto; padding: 40px 16px 48px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 24px; margin: 0 0 36px; padding: 0 1.2%; }
h1 { font-size: 30px; font-weight: 700; margin: 0; }
.author { margin: 0 0 0 auto; font-size: 16px; color: var(--muted); }
.line { break-inside: avoid; page-break-inside: avoid; margin: 0 0 24px; }
.line.section { margin-top: 40px; }
.line svg { display: block; width: 100%; height: auto; color: var(--ink); }
.digit { font-size: 22px; }
.acc { font-size: 15px; }
.triplet { font-size: 12px; font-style: italic; }
.chord { font-size: 17px; fill: var(--chord-ink); }
.chord-ext { font-size: 12px; }
.theme-toggle { position: fixed; top: 12px; right: 12px; width: 34px; height: 34px; border: 1px solid var(--muted); border-radius: 50%; background: var(--bg); color: var(--ink); font-size: 17px; line-height: 1; cursor: pointer; opacity: 0.55; }
.theme-toggle:hover, .theme-toggle:focus-visible { opacity: 1; }
@media print { main { max-width: none; padding: 0; } .theme-toggle { display: none; } }
</style>
<script>try { var t = localStorage.getItem('earcharts-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>

<script>
document.querySelector('.theme-toggle').addEventListener('click', function () {
  var root = document.documentElement;
  var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('earcharts-theme', root.dataset.theme); } catch (e) {}
});</script>
